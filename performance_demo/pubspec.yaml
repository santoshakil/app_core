name: performance_demo
description: Performance comparison demo between Dart and Rust via FFI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  app_core:
    path: ..

  # State management
  flutter_riverpod: ^2.5.1

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.19.0
  collection: ^1.18.0
  crypto: ^3.0.5
  ffi: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
